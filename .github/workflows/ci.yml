name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sahucodex
          POSTGRES_PASSWORD: sahucodex
          POSTGRES_DB: sahucodex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahucodex" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # Run the whole suite (and the migration/model drift check) on real PostgreSQL.
      TEST_DATABASE_URL: postgresql://sahucodex:sahucodex@localhost:5432/sahucodex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q

  judge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/judge
    env:
      # ubuntu-latest ships a usable Docker Engine, so the mandatory sandbox security tests (fork bombs, network and
      # filesystem escape attempts, resource limits — see docs/judge.md) run for real, against the local daemon.
      SJX_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/judge/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: pytest (real Docker sandbox tests included)
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.out
      # Job logs need repository admin rights to download, so a failure here would otherwise be a bare "exit code 1" to
      # anyone reading the run from outside. Annotations are visible to everyone who can see the run.
      - name: Surface failing tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.out | head -10 | while IFS= read -r line; do
            echo "::error title=judge test failed::${line:0:900}"
          done
          tail -n 40 pytest.out | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' | { read -r body; echo "::error title=judge pytest tail::${body:0:4000}"; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web
