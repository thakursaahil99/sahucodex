[project]
name = "sahucodex-api"
version = "0.1.0"
description = "SahuCodeX FastAPI backend"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Docker installs that; Vercel reads this list). `vercel` is only used by the
# serverless judge backend (JUDGE_BACKEND=vercel) and is deliberately not in requirements.txt.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "SQLAlchemy[asyncio]==2.0.54",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.3",
  "email-validator==2.3.0",
  "argon2-cffi==25.1.0",
  "PyJWT==2.14.0",
  "redis==8.1.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "celery==5.6.3",
  "httpx==0.28.1",
  "vercel==0.11.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fakeredis.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in defaults is the idiom
  "S101",   # assert is fine in tests and for type narrowing
  "S105",   # false positives on names like PASSWORD_RESET / token_type; real secrets come from env
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "RUF059"]
"app/core/email.py" = ["S603", "S607"]
